name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Coverage report only — gate NOT enforced (test:coverage:gate needs 10% lines;
      # local baseline ~8.03% as of 2026-08). Re-enable gate in this job once threshold passes.
      - name: Test coverage report (lib/**)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (Docker)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Apply migrations from scratch
        run: supabase db reset --yes

      - name: Probe desktop read RPCs (local)
        run: npx supabase db query --local --file scripts/probe_desktop_read_rpcs.sql

      - name: Verify function architecture (local)
        run: npx supabase db query --local --file scripts/verify_live_functions.sql

  # Playwright smoke tests against the Vite dev server (webServer in playwright.config.ts).
  # Skipped when VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repo secrets are unset (fork PRs, new clones).
  # Individual specs skip when optional VITE_TEST_* credential secrets are missing.
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    if: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_ANON_KEY != '' }}
    env:
      CI: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TEST_ADMIN_EMAIL: ${{ secrets.VITE_TEST_ADMIN_EMAIL }}
      VITE_TEST_ADMIN_PASSWORD: ${{ secrets.VITE_TEST_ADMIN_PASSWORD }}
      VITE_TEST_VIEWER_EMAIL: ${{ secrets.VITE_TEST_VIEWER_EMAIL }}
      VITE_TEST_VIEWER_PASSWORD: ${{ secrets.VITE_TEST_VIEWER_PASSWORD }}
      VITE_TEST_ORDER_ID: ${{ secrets.VITE_TEST_ORDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e:ci
